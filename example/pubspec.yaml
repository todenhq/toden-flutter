name: toden_flutter_example
description: "Minimal example showing how to launch a Toden verification with toden_flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Matches the SDK's own floor — the example can't run on anything older than
  # the package it depends on.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # The SDK under test, resolved from the package root.
  toden_flutter:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
