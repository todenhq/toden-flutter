# Lives in the PUBLIC repo todenhq/toden-flutter as .github/workflows/publish.yml.
# The monorepo sync never copies .github/ and keeps the public repo's own, so
# this canonical copy and the public one are kept in step by hand.
#
# Publishes with pub.dev's automated publishing: GitHub's OIDC token, no stored
# secret. On pub.dev, toden_flutter's Admin page must enable "Automated
# publishing" for repository todenhq/toden-flutter with tag pattern
# v{{version}}. The sync workflow pushes main and then creates the v<version>
# release, whose tag starts this job.
#
# The package's very first version cannot come from here: pub.dev only offers
# automated publishing for a package that exists, so 4.0.0 is published once
# by hand.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # pub.dev's OIDC token
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Exchanges the job's OIDC token for a pub.dev token and stores it where
      # `pub publish` reads it, for Flutter's Dart as well.
      - uses: dart-lang/setup-dart@v1

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: The tag matches the pubspec version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $VERSION"
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      # A pub.dev release cannot be deleted, only retracted, so a broken
      # version is permanent. These gates run before anything is uploaded.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 4.0.0 was published by hand, so its release tag finds it already there.
      # pub.dev answers 200 for a version it has and 404 otherwise.
      - name: Publish to pub.dev (skip if this version already exists)
        run: |
          NAME=$(grep -E '^name:' pubspec.yaml | head -1 | awk '{print $2}')
          VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/$NAME/versions/$VERSION")
          if [ "$CODE" = 200 ]; then
            echo "$NAME $VERSION is already on pub.dev; nothing to publish."
            exit 0
          fi
          flutter pub publish --force
